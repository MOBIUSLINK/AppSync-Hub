<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>授权登录</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { 
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            font-family: 'Inter', system-ui, sans-serif; 
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 1);
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            padding: 3rem;
            width: 100%;
            max-width: 420px;
        }
        .form-control:focus {
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
            border-color: #4f46e5;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-4">
            <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 64px; height: 64px;">
                <i class="fas fa-shield-alt fs-2"></i>
            </div>
            <h4 class="fw-bold text-dark">软件管理 <span class="text-primary">平台</span></h4>
            <p class="text-muted small">请输入系统管理密码</p>
        </div>

        {% if error %}
        <div class="alert alert-danger py-2 small fw-bold text-center"><i class="fas fa-exclamation-circle me-1"></i>{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="mb-4">
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="fas fa-key text-muted"></i></span>
                    <input type="password" name="password" class="form-control border-start-0 ps-0 bg-light" placeholder="访问密码" required autofocus>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold py-2" style="background-color: #4f46e5; border: none; border-radius: 8px;">
                进入控制台 <i class="fas fa-arrow-right ms-1"></i>
            </button>
        </form>
    </div>
</body>
</html>
